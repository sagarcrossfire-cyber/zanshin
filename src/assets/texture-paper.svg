<!-- Paper texture — spec §4.9. Hand-drawn SVG, no generation. Tileable feTurbulence grain, at most 3% opacity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Paper grain texture">
  <defs>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="256" height="256" fill="#000000" opacity="0"/>
  <rect width="256" height="256" filter="url(#paper)" opacity="0.03"/>
</svg>
