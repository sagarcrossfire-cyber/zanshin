# ZANSHIN — test, build and deploy.
#
# Every push and pull request runs the quick gate (types, lint, unit tests,
# data validation, build, bundle budget) and the full browser suite. A push
# to main that passes everything also builds the site's bundled media from
# Wavu Wiki and deploys the finished `dist` folder to Netlify. The monthly
# schedule redeploys with refreshed media (new clips after a game patch).
#
# Secrets (Repository → Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  a Netlify personal access token (User settings →
#                       Applications → Personal access tokens)
#   NETLIFY_SITE_ID     the project's Site ID (Project configuration → General)
# Without them the deploy job prints what is missing and ends green, so the
# checks still protect main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly media refresh + redeploy: 1st of the month, 09:17 UTC.
    - cron: '17 9 1 * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Netlify after the checks pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

# Jobs pin ubuntu-24.04: `ubuntu-latest` moved to Ubuntu 26 in October 2026,
# which Playwright's --with-deps does not support yet.

jobs:
  # Netlify's Free plan has 300 credits a month and every production deploy
  # costs 15 (docs/REFERENCE.md §6, 2026-11-01). Production deploys happen only
  # on a release (package.json version changed), a manual run, "[deploy]" in
  # the commit message, or the monthly media refresh when the media changed.
  # Pull requests get a free preview deploy instead.
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      production: ${{ steps.decide.outputs.production }}
      preview: ${{ steps.decide.outputs.preview }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_DEPLOY: ${{ inputs.deploy }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          production=false; preview=false
          now=$(node -p "require('./package.json').version")
          case "$EVENT" in
            pull_request)
              if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then preview=true; reason="pull request: free preview deploy"
              else reason="pull request from a fork: no deploy"; fi ;;
            workflow_dispatch)
              if [ "$DISPATCH_DEPLOY" = "true" ]; then production=true; reason="manual run with deploy"
              else reason="manual run without deploy"; fi ;;
            schedule)
              production=true; reason="monthly media refresh (deploys only if the media changed)" ;;
            *)
              was=$(git show "$BEFORE:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})" || true)
              if [ "$now" != "$was" ]; then production=true; reason="release ${was:-?} to $now"
              elif printf '%s' "$COMMIT_MSG" | grep -qF '[deploy]'; then production=true; reason="[deploy] in the commit message"
              else reason="version unchanged ($now): no production deploy, 15 Netlify credits saved"; fi ;;
          esac
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release gate::$reason"
          printf '### Release gate\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"

  quick:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --reporter=default --reporter=github-actions
      - run: npm run validate:data
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: npm run doctor
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Media pack script self-test
        run: |
          python -m pip install --quiet pillow
          python scripts/tests/test_media_pack.py

  e2e:
    name: Browser tests (phone and desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quick
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Full suite against the preview server
        run: npx playwright test --reporter=list,github
      - name: Smoke, media and PWA against Netlify-style headers (CSP)
        run: npx playwright test -c playwright.netlify.config.ts --reporter=list,github
      - name: Keep traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  media:
    name: Bundled media from Wavu Wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [quick, gate]
    if: needs.gate.outputs.production == 'true' || needs.gate.outputs.preview == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Download cache (files are re-verified against Wavu's checksums each run)
        uses: actions/cache@v6
        with:
          path: .zanshin-media-cache
          key: zanshin-media-cache-${{ github.run_id }}
          restore-keys: |
            zanshin-media-cache-
      - name: Build the site's media folder
        run: python scripts/make_zanshin_media_pack.py --site-dir public --cache-dir .zanshin-media-cache --delay 0.5
      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          m = json.load(open('public/media/manifest.json'))
          by = {}
          for it in m['items']: by[it['kind']] = by.get(it['kind'], 0) + 1
          size = sum(p.stat().st_size for p in pathlib.Path('public/media').rglob('*') if p.is_file())
          print(f"### Bundled media\n\n{len(m['items'])} items, {size/1e6:.1f} MB, pack `{m['packId']}`\n")
          for k, n in sorted(by.items()): print(f"- {k}: {n}")
          if m.get('misses'): print(f"\n{len(m['misses'])} not found on Wavu:")
          for miss in m.get('misses', [])[:30]: print(f"- {miss['subjectKey']} ({miss['title']})")
          # The same facts as annotations, readable through the API.
          kinds = ', '.join(f"{n} {k}" for k, n in sorted(by.items()))
          print(f"::notice title=Bundled media::{len(m['items'])} items, {size/1e6:.1f} MB, {m['packId']}: {kinds}", file=sys.stderr)
          if m.get('misses'):
              names = '; '.join(x['subjectKey'] for x in m['misses'][:20])
              print(f"::notice title=Not found on Wavu ({len(m['misses'])})::{names}", file=sys.stderr)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: site-media
          path: public/media
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [gate, e2e, media]
    if: needs.gate.outputs.production == 'true'
    environment:
      name: production
      url: https://glistening-conkies-c028b3.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site-media
          path: public/media
      - name: Build with bundled media
        run: npm run build
      - name: Checks on the finished site
        run: |
          test -f dist/_headers && test -f dist/_redirects
          test -f dist/media/manifest.json
          grep -q 'crossorigin="use-credentials"' dist/index.html
          node -e "const m=require('./dist/media/manifest.json'); if(!m.items.length) { console.error('bundled media is empty'); process.exit(1) } console.log(m.items.length, 'media items,', m.packId)"
          du -sh dist
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is not set; built but not deployed. Add both under Settings → Secrets and variables → Actions, then re-run this workflow."
            printf '### Not deployed\n\nAdd `NETLIFY_AUTH_TOKEN` and `NETLIFY_SITE_ID` as repository secrets and re-run.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then
            # Monthly refresh: skip the 15-credit deploy when the media files
            # (content-addressed names) match the live deploy's.
            live=$(npx --yes netlify-cli@27.16.1 api listSiteFiles --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).map(f=>f.path).filter(p=>p.startsWith('/media/')&&p!=='/media/manifest.json').sort().join('\\n'))}catch{console.log('unknown')}})")
            here=$(cd dist && find media -type f ! -name manifest.json | sed 's#^#/#' | LC_ALL=C sort)
            if [ "$live" = "$here" ]; then
              echo "::notice title=Deploy skipped::bundled media unchanged since the live deploy"
              printf '### Not deployed\n\nBundled media unchanged since the live deploy.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          npx --yes netlify-cli@27.16.1 deploy --prod --dir=dist --functions=netlify/functions --no-build \
            --message "GitHub Actions ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" | tee deploy.log
          printf '### Deployed\n\n%s\n' "$(grep -Eo 'https://[^ ]+' deploy.log | sort -u | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          # The intel function (release 1.3.0). The site is private, so an
          # unauthenticated probe answers 401; anything else than 401/200 is worth a look.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://glistening-conkies-c028b3.netlify.app/.netlify/functions/intel/health || echo 000)
          echo "intel health probe: HTTP $code (401 = sign-in wall, expected on a private site)"
          printf 'Intel function health probe: HTTP %s\n' "$code" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: zanshin-site
          path: dist
          retention-days: 14

  preview:
    name: Preview deploy (free, behind sign-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [gate, quick, media]
    if: needs.gate.outputs.preview == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site-media
          path: public/media
      - run: npm run build
      - name: Deploy preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Netlify secrets are not available to this run; no preview."
            exit 0
          fi
          npx --yes netlify-cli@27.16.1 deploy --dir=dist --functions=netlify/functions --no-build \
            --alias "pr-$PR" --message "PR #$PR ${GITHUB_SHA::7}" --json > preview.json
          url=$(node -p "require('./preview.json').deploy_url")
          echo "::notice title=Preview::$url (behind the Netlify login)"
          printf '### Preview\n\n%s (behind the Netlify login)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
