# Temporary (M2 Ranked Sync): capture real Wavu Wank responses as test fixtures.
# Lives only on the short-lived fixtures/ranked branch; deleted after use.
name: Ranked fixtures (temporary)

on:
  push:
    branches: ['fixtures/**']

permissions:
  contents: write

concurrency:
  group: fixtures-ranked
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ !startsWith(github.event.head_commit.message, 'fixtures: captured') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Capture (one request at a time, 3 s apart)
        run: python3 .github/scripts/capture_ranked.py
      - name: Commit the fixtures and summary
        run: |
          git config user.name "zanshin-fixtures"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tests/fixtures/ranked
          git commit -m "fixtures: captured ranked responses (run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
