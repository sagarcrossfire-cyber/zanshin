# Weekly dependency updates, grouped so a Monday brings one or two pull
# requests instead of twenty. CI runs on each one; nothing merges by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      # Node types follow the runtime the project runs on (.nvmrc, CI, Netlify: 22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # 7.x needs zod-validation-error 4 / zod 4; revisit with the zod 4 migration.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Chicago
    groups:
      actions:
        patterns: ['*']
